@startuml
!include ../l3/l3_6.pu

package "大機能" as l2{
  package "自動アノテーション機能"{
    object "大機能" as 2_3{
      id = 2-3
      detail = アノテーション結果から領域を調整できる機能
    }
  }
}

2_3 <- - 3_6
@enduml

@startuml
package "構成"{
  package "環境"{
    object "構成" as 5_3 #LightGreen{
      id = 5-3
      detail = nodejsを使用する
    }
  }
}

package "構成"{
  package "環境"{
    object "構成" as 5_6{
      id = 5-6
      detail = GUI上で画像編集操作できるように(T.B.D)を使用する
    }
  }
}

5_6 <- - 5_3

package "小機能"{
  package "GUI"{
    object "小機能" as 4_5{
      id = 4-5
      detail = GUI上で画像編集操作できる
    }
  }
}

4_5 <- - 5_6

package "中機能"{
