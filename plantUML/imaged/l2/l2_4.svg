@startuml
!include ../l3/l3_2.pu

package "大機能" as l2{
  package "自動アノテーション機能"{
    object "大機能" as 2_4{
      id = 2-4
      detail = 選択したアノテーション結果をエクスポートできる機能
    }
  }
}

2_4 <- - 3_2
@enduml

@startuml
package "構成"{
  package "環境"{
    object "構成" as 5_3 #LightGreen{
      id = 5-3
      detail = nodejsを使用する
    }
  }
}
package "構成"{
  package "環境"{
    object "構成" as 5_4 #LightGreen{
      id = 5-4
      detail = pythonを使用する
    }
  }
}

package "構成"{
  package "機能"{
    object "構成" as 5_15 #LightGreen{
      id = 5-15
      detail = ファイルシステムを使用する
    }
  }
}

5_15 <- - 5_3
5_15 <- - 5_4

