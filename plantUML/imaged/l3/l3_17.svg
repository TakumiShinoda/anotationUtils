@startuml
!include ../l4/l4_15.pu
!include ../l4/l4_16.pu

package "中機能"{
  package "画像ビュワー"{
    object "中機能" as 3_17 #LightGreen{
      id = 3-17
      detail = 表示中の画像ファイルパスをエクスプローラで開ける
    }
  }
}

3_17 <- - 4_15
3_17 <- - 4_16
@enduml

@startuml
package "構成"{
  package "環境"{
    object "構成" as 5_3 #LightGreen{
      id = 5-3
      detail = nodejsを使用する
    }
  }
}

package "構成"{
  package "環境"{
    object "構成" as 5_12 #LightGreen{
      id = 5-12
      detail = エクスプローラの起動/制御をnodejsのopen-file-explorerで実装する
    }
  }
}

5_12 <- - 5_3

package "小機能"{
  package "バックエンド"{
    object "小機能" as 4_15 #LightGreen{
      id = 4-15
      detail = GUIからエクスプローラを起動できる
    }
  }
}

4_15 <- - 5_12

package "小機能"{
  package "バックエンド"{
    object "小機能" as 4_16 #LightGreen{
      id = 4-16
      detail = エクスプローラで指定したパスを開ける
    }
  }
}

4_16 <- - 5_12

package "中機能"{
  package "画像ビュワー"{
    object "中機能" as 3_17 #LightGreen{
      id = 3-17
      detail = 表示中の画像ファイルパスをエクスプローラで開ける
    }
  }
}

3_17 <- - 4_15
3_17 <- - 4_16
@enduml

